<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title description">
  <title id="title">MDPro4 Workshop</title>
  <desc id="description">Updates, downloads and recovery. An amber release-card mark on the dark Ember palette used by MDPro4 Patch Studio.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#201c1a"/>
      <stop offset="1" stop-color="#29231f"/>
    </linearGradient>
    <radialGradient id="glow" cx="85%" cy="38%" r="65%">
      <stop stop-color="#945e36" stop-opacity=".52"/>
      <stop offset="1" stop-color="#945e36" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rule">
      <stop stop-color="#f0b979"/>
      <stop offset="1" stop-color="#f0b979" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#background)" stroke="#625247"/>
  <rect x="1" y="1" width="1198" height="298" rx="24" fill="url(#glow)"/>
  <path d="M760 300 1010 0M875 300 1125 0M990 300 1240 0" stroke="#f0b979" stroke-opacity=".06" fill="none"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="60" y="55" fill="#f0b979" font-size="13" font-weight="600" letter-spacing="4">REQUIEM / RELEASE HUB</text>
    <text x="56" y="135" fill="#fff4e9" font-size="78" font-weight="700" letter-spacing="-3">MDPro4</text>
    <text x="61" y="183" fill="#f0b979" font-size="30" font-weight="600" letter-spacing="8">WORKSHOP</text>
    <path d="M62 204H630" stroke="url(#rule)"/>
    <text x="61" y="239" fill="#cbbbad" font-size="21">Updates, downloads &amp; recovery</text>
    <text x="61" y="272" fill="#cbbbad" font-size="13" letter-spacing="1.6">WINDOWS  ·  ANDROID  ·  LINUX  ·  macOS</text>
  </g>
  <!-- Reuses Patch Studio's symbol_shapes(True) geometry and Ember colors. -->
  <g transform="translate(929 52) scale(3)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round">
    <path d="M7 12H31L35 16V39L31 43H7L4 39V16Z" fill="#504034" stroke="#e99b78"/>
    <path d="M12 23H26M12 30H21" fill="none" stroke="#e99b78"/>
    <path d="M31 31H55L59 35V56L55 60H31L27 56V35Z" fill="#39302a" stroke="#f0b979"/>
    <path d="M36 45H50M43 38V52M35 9H44L53 18V25M47 20L53 26L59 20" fill="none" stroke="#f0b979"/>
    <path d="M7 49V53L13 58H21" fill="none" stroke="#e99b78"/>
  </g>
  <circle cx="904" cy="69" r="3" fill="#e99b78"/>
  <circle cx="1140" cy="230" r="3" fill="#f0b979"/>
</svg>
